[project]
name = "acceptrate"
version = "0.0.1"
description = "Adaptive speculative decoding for Apple Silicon, plus the measurement framework that proves when it pays off."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "kidus", email = "kidusdereje41@gmail.com" }]
dependencies = [
    "duckdb>=1.5.5",
    "huggingface-hub>=1.31.0",
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2",
    "typer>=0.27.2",
]

[project.scripts]
acceptrate = "acceptrate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acceptrate"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "model: needs downloaded model weights and an Apple GPU; never runs in CI",
  "perf: produces performance numbers; never runs in CI",
]
