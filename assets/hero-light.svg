<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="acceptrate — adaptive speculative decoding for Apple Silicon, measured honestly">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52B9C8"/><stop offset="1" stop-color="#5CBE81"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F2328"/><stop offset=".7" stop-color="#1F2328"/><stop offset="1" stop-color="#0A6B76"/></linearGradient>
  </defs>
  <style>
    .f { font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .rise { opacity: 0; transform: translateY(10px); animation: rise .8s cubic-bezier(.2,.7,.3,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s } .d4 { animation-delay: .75s }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .on { opacity: 0; animation: pop 6s ease-out infinite; }
    @keyframes pop { 0% { opacity: 0 } 6% { opacity: 1 } 70% { opacity: 1 } 80% { opacity: 0 } 100% { opacity: 0 } }
    .k { animation: spring 6s cubic-bezier(.2,.9,.3,1.3) infinite; transform-origin: 1040px 210px; }
    @keyframes spring { 0%,35% { transform: translateX(0) } 45%,85% { transform: translateX(96px) } 95%,100% { transform: translateX(0) } }
    .mark { animation: glow 4s ease-in-out infinite alternate; }
    @keyframes glow { from { filter: drop-shadow(0 0 0 rgba(82,185,200,0)); } to { filter: drop-shadow(0 6px 18px rgba(82,185,200,.35)); } }
    @media (prefers-reduced-motion: reduce) { .rise, .on, .k, .mark { animation: none; opacity: 1; transform: none; } }
  </style>

  <g class="mark rise d1">
    <rect x="40" y="70" width="112" height="112" rx="30" fill="url(#g)"/>
    <rect x="40" y="70" width="112" height="56" rx="30" fill="url(#sheen)"/>
    <path d="M68 130 L87 149 L124 108" fill="none" stroke="#0E1319" stroke-opacity=".22" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,3)"/>
    <path d="M68 130 L87 149 L124 108" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="108" r="8" fill="#fff"/>
  </g>

  <text class="f rise d2" x="180" y="139" font-size="84" font-weight="700" letter-spacing="-3.5" fill="url(#wm)">acceptrate</text>
  <text class="f rise d3" x="184" y="182" font-size="21" font-weight="500" fill="#59636E">Adaptive speculative decoding for Apple Silicon — measured honestly.</text>
  <text class="m rise d4" x="184" y="214" font-size="13" fill="#59636E" letter-spacing="1.5">MLX · M4 16 GB · 90,654 MEASURED DRAFT WINDOWS · ONE ROW PER WINDOW</text>

  <!-- instrument panel -->
  <g class="rise d3">
    <text class="m" x="640" y="70" font-size="11" fill="#59636E" letter-spacing="1.5">DRAFT WINDOWS</text>
    <rect class="cell" x="640" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:0.90s" x="640" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="661" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:0.99s" x="661" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="682" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.08s" x="682" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="703" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.17s" x="703" y="84" width="16" height="34" rx="3" fill="#9A5A04"/><rect class="cell" x="724" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.26s" x="724" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="745" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.35s" x="745" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="766" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.44s" x="766" y="84" width="16" height="34" rx="3" fill="#9A5A04"/><rect class="cell" x="787" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.53s" x="787" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="808" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.62s" x="808" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="829" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.71s" x="829" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="850" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.80s" x="850" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="871" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.89s" x="871" y="84" width="16" height="34" rx="3" fill="#9A5A04"/><rect class="cell" x="892" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:1.98s" x="892" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="913" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.07s" x="913" y="84" width="16" height="34" rx="3" fill="#9A5A04"/><rect class="cell" x="934" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.16s" x="934" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="955" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.25s" x="955" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="976" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.34s" x="976" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="997" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.43s" x="997" y="84" width="16" height="34" rx="3" fill="#9A5A04"/><rect class="cell" x="1018" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.52s" x="1018" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="1039" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.61s" x="1039" y="84" width="16" height="34" rx="3" fill="#2C7A4C"/><rect class="cell" x="1060" y="84" width="16" height="34" rx="3" fill="#E3E8ED"/><rect class="on" style="animation-delay:2.70s" x="1060" y="84" width="16" height="34" rx="3" fill="#9A5A04"/><rect class="cell" x="1081" y="84" width="