    <text class="m" x="640" y="150" font-size="11" fill="#59636E" letter-spacing="1.5">DRAFT DEPTH</text>
    <line x1="640" y1="178" x2="1160" y2="178" stroke="#D0D7DE" stroke-width="2"/>
    <g class="m" font-size="11" fill="#59636E">
      <text x="640" y="200">K=1</text><text x="736" y="200">2</text><text x="832" y="200">3</text><text x="928" y="200">4</text><text x="1024" y="200">5</text><text x="1120" y="200">6</text>
    </g>
    <g class="k">
      <circle cx="736" cy="178" r="9" fill="#9A5A04"/>
      <circle cx="736" cy="178" r="4" fill="#0E1319" fill-opacity=".35"/>
    </g>
    <text class="m" x="1160" y="240" text-anchor="end" font-size="12" fill="#2C7A4C">1.9× on code · 1.6× on chat · loses past K=5</text>
