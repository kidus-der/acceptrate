<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="acceptrate — adaptive speculative decoding for Apple Silicon, measured honestly">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52B9C8"/><stop offset="1" stop-color="#5CBE81"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6EDF3"/><stop offset=".7" stop-color="#E6EDF3"/><stop offset="1" stop-color="#52B9C8"/></linearGradient>
  </defs>
  <style>
    .f { font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .rise { opacity: 0; transform: translateY(10px); animation: rise .8s cubic-bezier(.2,.7,.3,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s } .d4 { animation-delay: .75s }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .on { opacity: 0; animation: pop 6s ease-out infinite; }
    @keyframes pop { 0% { opacity: 0 } 6% { opacity: 1 } 70% { opacity: 1 } 80% { opacity: 0 } 100% { opacity: 0 } }
    .k { animation: spring 6s cubic-bezier(.2,.9,.3,1.3) infinite; }
    @keyframes spring { 0%,35% { transform: translateX(0) } 45%,85% { transform: translateX(88px) } 95%,100% { transform: translateX(0) } }
    .mark { animation: glow 4s ease-in-out infinite alternate; }
    @keyframes glow { from { filter: drop-shadow(0 0 0 rgba(82,185,200,0)); } to { filter: drop-shadow(0 6px 18px rgba(82,185,200,.35)); } }
    @media (prefers-reduced-motion: reduce) { .rise, .on, .k, .mark { animation: none; opacity: 1; transform: none; } }
  </style>

  <g class="mark rise d1">
    <rect x="40" y="96" width="112" height="112" rx="30" fill="url(#g)"/>
    <rect x="40" y="96" width="112" height="56" rx="30" fill="url(#sheen)"/>
    <path d="M68 156 L87 175 L124 134" fill="none" stroke="#0E1319" stroke-opacity=".22" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,3)"/>
    <path d="M68 156 L87 175 L124 134" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="134" r="8" fill="#fff"/>
  </g>

  <text class="f rise d2" x="180" y="152" font-size="80" font-weight="700" letter-spacing="-3.5" fill="url(#wm)">acceptrate</text>
  <text class="f rise d3" x="184" y="192" font-size="19" font-weight="500" fill="#8B949E">Adaptive speculative decoding for Apple Silicon,</text>
  <text class="f rise d3" x="184" y="217" font-size="19" font-weight="500" fill="#8B949E">measured honestly.</text>
  <text class="m rise d4" x="184" y="252" font-size="12" fill="#8B949E" letter-spacing="1.5">MLX · M4 16 GB · 90,654 MEASURED DRAFT WINDOWS</text>

  <!-- instrument panel: its own band; nothing from the left column enters x >= 660 -->
  <g class="rise d3">
    <rect x="664" y="52" width="512" height="254" rx="14" fill="#161B22" stroke="#30363D"/>
    <text class="m" x="700" y="80" font-size="11" fill="#8B949E" letter-spacing="1.5">DRAFT WINDOWS</text>
    <rect x="700" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:0.90s" x="700" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="721" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:0.99s" x="721" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="742" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.08s" x="742" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="763" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.17s" x="763" y="92" width="16" height="32" rx="3" fill="#E3A44C"/><rect x="784" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.26s" x="784" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="805" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.35s" x="805" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="826" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.44s" x="826" y="92" width="16" height="32" rx="3" fill="#E3A44C"/><rect x="847" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.53s" x="847" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="868" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.62s" x="868" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="889" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.71s" x="889" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="910" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.80s" x="910" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="931" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.89s" x="931" y="92" width="16" height="32" rx="3" fill="#E3A44C"/><rect x="952" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:1.98s" x="952" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="973" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.07s" x="973" y="92" width="16" height="32" rx="3" fill="#E3A44C"/><rect x="994" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.16s" x="994" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="1015" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.25s" x="1015" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="1036" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.34s" x="1036" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="1057" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.43s" x="1057" y="92" width="16" height="32" rx="3" fill="#E3A44C"/><rect x="1078" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.52s" x="1078" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="1099" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.61s" x="1099" y="92" width="16" height="32" rx="3" fill="#5CBE81"/><rect x="1120" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.70s" x="1120" y="92" width="16" height="32" rx="3" fill="#E3A44C"/><rect x="1141" y="92" width="16" height="32" rx="3" fill="#253039"/><rect class="on" style="animation-delay:2.79s" x="1141" y="92" width="16" height="32" rx="3" fill="#5CBE81"/>
    <text class="m" x="700" y="166" font-size="11" fill="#8B949E" letter-spacing="1.5">DRAFT DEPTH</text>
    <line x1="700" y1="204" x2="1140" y2="204" stroke="#30363D" stroke-width="2"/>
    <g class="m" font-size="11" fill="#8B949E">
      <text x="700" y="240">K=1</text><text x="788" y="240">2</text><text x="876" y="240">3</text><text x="964" y="240">4</text><text x="1052" y="240">5</text><text x="1140" y="240" text-anchor="end">6</text>
    </g>
    <g class="k">
      <circle cx="788" cy="204" r="9" fill="#E3A44C"/>
      <circle cx="788" cy="204" r="4" fill="#0E1319" fill-opacity=".35"/>
    </g>
    <text class="m" x="1140" y="284" text-anchor="end" font-size="12" fill="#5CBE81">1.9× on code · 1.6× on chat · loses past K=5</text>
  </g>
</svg>
