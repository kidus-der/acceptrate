<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Cost of one verify pass in plain decode steps rises from 1.0 at K=1 to 2.96 at K=8">
  <style>
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bar { transform: scaleY(0); animation: grow .9s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    .lab { opacity: 0; animation: fade .4s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: none; } .lab { animation: none; opacity: 1; } }
  </style>
  <text class="m" x="60" y="24" font-size="11" fill="#8B949E" letter-spacing="1.5">COST OF ONE VERIFY PASS, IN PLAIN DECODE STEPS · M4, 8B 4-BIT TARGET</text>
  <line x1="60" y1="185.2" x2="870" y2="185.2" stroke="#30363D"/><text class="m" x="50" y="189.2" text-anchor="end" font-size="11" fill="#8B949E">1×</text><line x1="60" y1="120.3" x2="870" y2="120.3" stroke="#30363D"/><text class="m" x="50" y="124.3" text-anchor="end" font-size="11" fill="#8B949E">2×</text><line x1="60" y1="55.5" x2="870" y2="55.5" stroke="#30363D"/><text class="m" x="50" y="59.5" text-anchor="end" font-size="11" fill="#8B949E">3×</text><line x1="60" y1="185.2" x2="870" y2="185.2" stroke="#52B9C8" stroke-width="1.4" stroke-dasharray="5 4"/><text class="m" x="870" y="178.2" text-anchor="end" font-size="10.5" fill="#52B9C8">what the textbook assumes: 1.0 everywhere</text><rect class="bar" style="animation-delay:0.00s; transform-origin: 0 250.0px" x="80.2" y="185.2" width="60.8" height="64.8" rx="3" fill="#5CBE81"/><text class="m lab" style="animation-delay:0.70s" x="110.6" y="178.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">1.00</text><text class="m" x="110.6" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=1</text><rect class="bar" style="animation-delay:0.08s; transform-origin: 0 250.0px" x="181.5" y="181.9" width="60.8" height="68.1" rx="3" fill="#5CBE81"/><text class="m lab" style="animation-delay:0.78s" x="211.9" y="174.9" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">1.05</text><text class="m" x="211.9" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=2</text><rect class="bar" style="animation-delay:0.16s; transform-origin: 0 250.0px" x="282.8" y="165.7" width="60.8" height="84.3" rx="3" fill="#E3A44C"/><text class="m lab" style="animation-delay:0.86s" x="313.1" y="158.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">1.30</text><text class="m" x="313.1" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=3</text><rect class="bar" style="animation-delay:0.24s; transform-origin: 0 250.0px" x="384.0" y="148.2" width="60.8" height="101.8" rx="3" fill="#E3A44C"/><text class="m lab" style="animation-delay:0.94s" x="414.4" y="141.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">1.57</text><text class="m" x="414.4" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=4</text><rect class="bar" style="animation-delay:0.32s; transform-origin: 0 250.0px" x="485.2" y="121.6" width="60.8" height="128.4" rx="3" fill="#E2697C"/><text class="m lab" style="animation-delay:1.02s" x="515.6" y="114.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">1.98</text><text class="m" x="515.6" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=5</text><rect class="bar" style="animation-delay:0.40s; transform-origin: 0 250.0px" x="586.5" y="92.4" width="60.8" height="157.6" rx="3" fill="#E2697C"/><text class="m lab" style="animation-delay:1.10s" x="616.9" y="85.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">2.43</text><text class="m" x="616.9" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=6</text><rect class="bar" style="animation-delay:0.48s; transform-origin: 0 250.0px" x="687.8" y="89.2" width="60.8" height="160.8" rx="3" fill="#E2697C"/><text class="m lab" style="animation-delay:1.18s" x="718.1" y="82.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">2.48</text><text class="m" x="718.1" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=7</text><rect class="bar" style="animation-delay:0.56s; transform-origin: 0 250.0px" x="789.0" y="58.0" width="60.8" height="192.0" rx="3" fill="#E2697C"/><text class="m lab" style="animation-delay:1.26s" x="819.4" y="51.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E6EDF3">2.96</text><text class="m" x="819.4" y="270" text-anchor="middle" font-size="11" fill="#8B949E">K=8</text>
  <text class="m" x="465" y="292" text-anchor="middle" font-size="10.5" fill="#8B949E">free up to two guesses, then it climbs — this one curve explains the whole grid</text>
</svg>
